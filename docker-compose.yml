name: datalake-medalhao

# Portas só em 127.0.0.1: é um ambiente local de estudo.
services:
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?rode python criar_env.py}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?rode python criar_env.py}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:${RUSTFS_CONSOLE_PORT:-9001}"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?rode python criar_env.py}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?rode python criar_env.py}
    volumes:
      - superset_data:/app/superset_home
      - ./data/gold:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  rustfs_data:
  superset_data:
